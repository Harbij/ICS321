<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tournament Manager - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: white;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 128, 0, 0.2);
      width: 400px;
      text-align: center;
    }

    .card h2 {
      margin: 15px 0;
      font-size: 26px;
    }

    .card p {
      color: #555;
      font-size: 16px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #cfcfcf;
      border-radius: 8px;
      font-size: 16px;
    }

    .checkbox-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin: 15px 0;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background-color: #3d634c;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #218838;
    }

    .link {
      font-size: 14px;
      margin-top: 20px;
    }

    .link a {
      text-decoration: none;
      color: #3d634c;
    }

    .icon {
      font-size: 48px;
      color: #3d634c;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🏆</div>
    <h2>Tournament Manager</h2>
    <p>Sign in to your account</p>
    <form>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <div class="checkbox-row">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <div class="link">Don't have an account? <a href="#">Sign up</a></div>
  </div>

</body>
</html>
