<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logout - Tournament Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: white;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 128, 0, 0.2);
      width: 400px;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      color: #3d634c;
      margin-bottom: 10px;
    }

    .card h2 {
      margin: 15px 0;
      font-size: 26px;
    }

    .card p {
      color: #555;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background-color: #3d634c;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #218838;
    }

    .btn-outline {
      background-color: white;
      border: 1px solid #ccc;
      color: #3d634c;
      font-weight: bold;
    }

    .btn-outline:hover {
      background-color: #e6f2e6;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">↩️</div>
    <h2>Confirm Logout</h2>
    <p>Are you sure you want to log out of Tournament Manager?</p>
    <button class="btn">Yes, Log Out</button>
    <button class="btn btn-outline">Cancel</button>
  </div>

</body>
</html>
